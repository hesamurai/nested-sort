<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Custom Render Function Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">

  <style>
    .nested-sort {
      display: flex;
    }
    .nested-sort > li {
      border: none;
      border-radius: 4px;
      text-align: center;
    }
    .nested-sort > li:not(:last-child) {
      margin-right: 10px;
    }

    .nested-sort img {
      display: block;
      margin-top: 10px;
    }
    .nested-sort > .very-custom-list-item {
      box-shadow: 0 0 10px 0 rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Custom render function for list items</h1>
  <p>This sample uses a custom function to control how a list item should be rendered.</p>
  <div id="draggable"></div>
</div>

<!-- Scripts -->
<script type="module" src="custom-render.ts"></script>
</body>
</html>
